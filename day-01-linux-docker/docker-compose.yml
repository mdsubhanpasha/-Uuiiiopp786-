services:
  # ----------------------------------------------------------------------------
  # Service 1: PostgreSQL Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: testgen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-testgen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-testgen_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - testgen_network

  # ----------------------------------------------------------------------------
  # Service 2: Redis Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: testgen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - testgen_network

  # ----------------------------------------------------------------------------
  # Service 3: FastAPI Backend Application
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: day-01-linux-docker/Dockerfile
    container_name: testgen_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres_password_change_me@db:5432/testgen_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - testgen_network

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  testgen_network:
    driver: bridge
