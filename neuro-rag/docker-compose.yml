version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pasha_neuro_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pasha_neuro_rag_backend
    command: uvicorn neuro_rag.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder-key}
      - LLM_MODEL=gpt-4o
      - EMBEDDING_MODEL=text-embedding-3-large
    depends_on:
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pasha_neuro_rag_frontend
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  qdrant_storage:
