# WHY: Automated Self-Service Developer Onboarding in Under 15 Minutes.
# WHAT: Backstage Software Template manifest defining automated repository creation, CI/CD pipeline setup, Kubernetes Helm values, Monitoring alerts, and Vault secret roles.
# WHERE USED: Layer 9 Developer Portal catalog template.
# RECRUITER ANSWER: "Reduces engineer onboarding and new service bootstrap time from 1 week to 15 minutes through self-service Backstage software templates."

apiVersion: backstage.io/v1alpha1
kind: Template
metadata:
  name: pasha-q-omni-microservice-template
  title: Quantum MLOps 2050 Microservice Template
  description: Create a production-ready Multi-Cloud Quantum MLOps service with CI/CD, K8s, Vault, and Grafana instrumentation.
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Details
      required:
        - serviceName
        - owner
      properties:
        serviceName:
          title: Service Name
          type: string
          default: pasha-quantum-service
        owner:
          title: Owner Group
          type: string
          default: platform-engineering

  steps:
    - id: template
      name: Generate Service Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.serviceName }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish Repository to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: Multi-Cloud Quantum MLOps Microservice
        repoUrl: github.com?repo=${{ parameters.serviceName }}&owner=org

    - id: register
      name: Register Component in Catalog
      action: catalog:register
      input:
        catalogInfoUrl: 'https://github.com/org/${{ parameters.serviceName }}/blob/main/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
