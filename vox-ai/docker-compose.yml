version: '3.8'

services:
  vox-ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vox-ai-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-mock_key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock_key}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-mock_key}
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: vox-ai-redis
    ports:
      - "6379:6379"
    restart: always
