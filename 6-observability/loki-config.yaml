# WHY: Loki Log Aggregation Engine Configuration.
# WHAT: YAML configuration file for Promtail log shipping to Loki for rapid crash debugging.
# WHERE USED: 6-observability Loki log collection agent.
# RECRUITER ANSWER: "Centralizes structured JSON telemetry logs into Loki for instant root-cause analysis during incident responses."

auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 1m
  chunk_retain_period: 30s
  max_chunk_age: 1m
  max_transfer_retries: 0

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
