version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: pasha-brand-os-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pasha-brand-os-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_PATH=/app/app/pasha_brand_os.db
    volumes:
      - ./outputs:/app/outputs
      - ./app:/app/app
    depends_on:
      - qdrant
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pasha-brand-os-frontend
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: always

volumes:
  qdrant_storage:
