apiVersion: v1
kind: ConfigMap
metadata:
  name: finagent-ops-config
  namespace: default
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/part-of: finagent-ops-system
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: finagent-ops-secret
  namespace: default
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/part-of: finagent-ops-system
type: Opaque
stringData:
  DATABASE_URL: "postgresql://finagent_admin:SecurePassword123!@finagent-db.rds.amazonaws.com:5432/finagent_db"
  GEMINI_API_KEY: "placeholder-gemini-api-key"
  GITHUB_TOKEN: "placeholder-github-token"
  LINKEDIN_ACCESS_TOKEN: "placeholder-linkedin-access-token"
