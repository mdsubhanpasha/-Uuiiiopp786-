apiVersion: v1
kind: ConfigMap
metadata:
  name: finagent-ops-config
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/part-of: finagent-ops-engine
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: finagent-ops-secret
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/part-of: finagent-ops-engine
type: Opaque
stringData:
  DATABASE_URI: "postgresql://user:password@finagent-db.internal:5432/finagent_db"
  GEMINI_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  GITHUB_TOKEN: "CHANGE_ME_IN_PRODUCTION"
  LINKEDIN_ACCESS_TOKEN: "CHANGE_ME_IN_PRODUCTION"
