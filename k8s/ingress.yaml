apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finagent-ops-ingress
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - finagent-ops.example.com
    secretName: finagent-ops-tls
  rules:
  - host: finagent-ops.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finagent-ops-clusterip-service
            port:
              number: 8000
