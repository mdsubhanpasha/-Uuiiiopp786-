apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finagent-ops-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - finagent.example.com
      secretName: finagent-ops-tls
  rules:
    - host: finagent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finagent-ops-internal-service
                port:
                  number: 8000
