apiVersion: v1
kind: Namespace
metadata:
  name: auron-corp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auron-config
  namespace: auron-corp
data:
  SYSTEM_NAME: "AURON-CORP-137Q"
  ARCHITECT: "Mohammad Subhan Pasha"
  LOG_LEVEL: "INFO"
  QUANTUM_QUBITS: "6"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auron-corp-deployment
  namespace: auron-corp
  labels:
    app: auron-corp-137q
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auron-corp-137q
  template:
    metadata:
      labels:
        app: auron-corp-137q
    spec:
      containers:
      - name: auron-api
        image: auroncorp/auron-137q:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http-ws
        envFrom:
        - configMapRef:
            name: auron-config
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auron-corp-service
  namespace: auron-corp
spec:
  type: ClusterIP
  selector:
    app: auron-corp-137q
  ports:
  - port: 8000
    targetPort: 8000
    name: http-ws
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auron-corp-ingress
  namespace: auron-corp
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/websocket-services: "auron-corp-service"
spec:
  rules:
  - host: auron137q.pasha-os.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auron-corp-service
            port:
              number: 8000
