apiVersion: apps/v1
kind: Deployment
metadata:
  name: finagent-ops
  namespace: default
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/component: api-service
    app.kubernetes.io/part-of: finagent-ops-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finagent-ops
  template:
    metadata:
      labels:
        app: finagent-ops
        app.kubernetes.io/name: finagent-ops
        app.kubernetes.io/component: api-service
    spec:
      containers:
        - name: finagent-ops
          image: finagent-ops:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "main.py", "--mode", "api", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: finagent-ops-config
            - secretRef:
                name: finagent-ops-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 10001
