apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finagent-ops-hpa
  namespace: default
  labels:
    app.kubernetes.io/name: finagent-ops
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finagent-ops
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
