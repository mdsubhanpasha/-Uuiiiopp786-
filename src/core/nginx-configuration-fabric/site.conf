server {
    listen 80;
    listen [::]:80;
    server_name nayeem-edge.enterprise.io www.nayeem-edge.enterprise.io localhost;

    root /var/www/nayeem-edge;
    index index.html;

    # Enterprise Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Global Rate Limiting
    limit_req zone=req_limit_per_ip burst=20 nodelay;
    limit_conn conn_limit_per_ip 20;

    # Primary Web Static Assets
    location / {
        try_files $uri $uri/ =404;
    }

    # Static Assets Caching Policy (1 Year)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Enterprise Health & Telemetry Endpoint
    location /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"NAYEEM-EDGE","version":"1.0.0","pr_evidence":["PR-30","PR-32","PR-33"],"latency_ms":1.2,"edge_node":"us-east-1-edge-01"}';
    }

    # Custom Error Pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
