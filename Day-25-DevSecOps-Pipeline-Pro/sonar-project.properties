# SonarQube Project Configuration
# Defines project key, metadata, source code paths, and coverage configuration.

sonar.projectKey=devsecops-pipeline-pro
sonar.projectName=DevSecOps Pipeline Pro - Day 25
sonar.projectVersion=1.0.0

# Paths to source code & test suites
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=app/test_app.py
sonar.exclusions=app/test_app.py,**/__pycache__/**,**/*.pyc

# Language & Encoding Configuration
sonar.language=py
sonar.sourceEncoding=UTF-8

# Code Coverage & Python Specific Settings
sonar.python.version=3.9
sonar.python.coverage.reportPaths=coverage.xml
