version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pasha-nexus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main_api:app --host 0.0.0.0 --port 8000
    container_name: pasha-nexus-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    container_name: pasha-nexus-app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: always

volumes:
  qdrant_data:
